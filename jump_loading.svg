<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Helvetica,Arial,sans-serif">
<rect x="1" y="1" width="958" height="558" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
<defs><marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/></marker><marker id="ahb" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3b82f6"/></marker></defs>
<text x="40" y="48" font-size="25" font-weight="700" fill="#0f172a">Jump Loading <tspan font-size="15" font-weight="400" fill="#64748b">(tree depths 3–6)</tspan></text>
<text x="40" y="76" font-size="14" fill="#475569">Scratch can’t be indexed dynamically, so we <tspan font-weight="700">unroll one copy-instruction per node</tspan> and <tspan font-family="Menlo,monospace">jump_indirect</tspan> to the right one at runtime.</text>
<text x="133" y="150" font-size="12" font-weight="600" text-anchor="middle" fill="#64748b" font-family="Helvetica,Arial,sans-serif">runtime tree index</text>
<rect x="78" y="160" width="110" height="40" rx="10" fill="#fef9c3" stroke="#facc15"/>
<text x="133" y="185" font-size="16" font-weight="700" text-anchor="middle" fill="#854d0e" font-family="Menlo,Consolas,monospace">idx = 9</text>
<rect x="48" y="226" width="170" height="58" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="133" y="248" font-size="12.5" font-weight="600" text-anchor="middle" fill="#334155" font-family="Helvetica,Arial,sans-serif">jump target =</text>
<text x="133" y="270" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d4ed8" font-family="Menlo,Consolas,monospace">base + idx × stride</text>
<line x1="133" y1="201" x2="133" y2="224" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ah)"/>
<path d="M 220 268 C 262 268, 266 271, 306 271" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="301" y="250" font-size="10.5" font-weight="700" text-anchor="end" fill="#334155" font-family="Menlo,Consolas,monospace">jump_indirect</text>
<text x="437.0" y="150" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a" font-family="Helvetica,Arial,sans-serif">Generated program</text>
<text x="437.0" y="168" font-size="11" font-weight="400" text-anchor="middle" fill="#64748b" font-family="Helvetica,Arial,sans-serif">one copy-instruction per node (unrolled at build time)</text>
<rect x="306" y="188" width="262" height="256" rx="12" fill="#fbfcfe" stroke="#eef2f7"/>
<rect x="312" y="198" width="250" height="26" rx="6" fill="#f8fafc" stroke="#e7ebf0"/>
<text x="326" y="215" font-size="12.5" font-weight="600" fill="#64748b" font-family="Menlo,Consolas,monospace">node_val ← s[7]</text>
<text x="546" y="215" font-size="13" text-anchor="middle" fill="#cbd5e1">↩</text>
<rect x="312" y="228" width="250" height="26" rx="6" fill="#f8fafc" stroke="#e7ebf0"/>
<text x="326" y="245" font-size="12.5" font-weight="600" fill="#64748b" font-family="Menlo,Consolas,monospace">node_val ← s[8]</text>
<text x="546" y="245" font-size="13" text-anchor="middle" fill="#cbd5e1">↩</text>
<rect x="312" y="258" width="250" height="26" rx="6" fill="#dcfce7" stroke="#22c55e"/>
<text x="326" y="275" font-size="12.5" font-weight="600" fill="#0f172a" font-family="Menlo,Consolas,monospace">node_val ← s[9]</text>
<text x="546" y="275" font-size="13" text-anchor="middle" fill="#15803d">↩</text>
<rect x="312" y="288" width="250" height="26" rx="6" fill="#f8fafc" stroke="#e7ebf0"/>
<text x="326" y="305" font-size="12.5" font-weight="600" fill="#64748b" font-family="Menlo,Consolas,monospace">node_val ← s[10]</text>
<text x="546" y="305" font-size="13" text-anchor="middle" fill="#cbd5e1">↩</text>
<rect x="312" y="318" width="250" height="26" rx="6" fill="#f8fafc" stroke="#e7ebf0"/>
<text x="326" y="335" font-size="12.5" font-weight="600" fill="#64748b" font-family="Menlo,Consolas,monospace">node_val ← s[11]</text>
<text x="546" y="335" font-size="13" text-anchor="middle" fill="#cbd5e1">↩</text>
<rect x="312" y="348" width="250" height="26" rx="6" fill="#f8fafc" stroke="#e7ebf0"/>
<text x="326" y="365" font-size="12.5" font-weight="600" fill="#64748b" font-family="Menlo,Consolas,monospace">node_val ← s[12]</text>
<text x="546" y="365" font-size="13" text-anchor="middle" fill="#cbd5e1">↩</text>
<rect x="312" y="378" width="250" height="26" rx="6" fill="#f8fafc" stroke="#e7ebf0"/>
<text x="326" y="395" font-size="12.5" font-weight="600" fill="#64748b" font-family="Menlo,Consolas,monospace">node_val ← s[13]</text>
<text x="546" y="395" font-size="13" text-anchor="middle" fill="#cbd5e1">↩</text>
<rect x="312" y="408" width="250" height="26" rx="6" fill="#f8fafc" stroke="#e7ebf0"/>
<text x="326" y="425" font-size="12.5" font-weight="600" fill="#64748b" font-family="Menlo,Consolas,monospace">node_val ← s[14]</text>
<text x="546" y="425" font-size="13" text-anchor="middle" fill="#cbd5e1">↩</text>
<text x="788.0" y="150" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a" font-family="Helvetica,Arial,sans-serif">Scratch</text>
<text x="788.0" y="168" font-size="11" font-weight="400" text-anchor="middle" fill="#64748b" font-family="Helvetica,Arial,sans-serif">4 preloaded tree layers</text>
<rect x="684" y="188" width="208" height="256" rx="12" fill="#f0f7ff" stroke="#e0ecfb"/>
<rect x="690" y="198" width="196" height="26" rx="6" fill="#f8fafc" stroke="#e7ebf0"/>
<text x="788" y="215" font-size="12.5" font-weight="600" text-anchor="middle" fill="#94a3b8" font-family="Menlo,Consolas,monospace">s[7] = v₇</text>
<rect x="690" y="228" width="196" height="26" rx="6" fill="#f8fafc" stroke="#e7ebf0"/>
<text x="788" y="245" font-size="12.5" font-weight="600" text-anchor="middle" fill="#94a3b8" font-family="Menlo,Consolas,monospace">s[8] = v₈</text>
<rect x="690" y="258" width="196" height="26" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
<text x="788" y="275" font-size="12.5" font-weight="700" text-anchor="middle" fill="#1d4ed8" font-family="Menlo,Consolas,monospace">s[9] = v₉</text>
<rect x="690" y="288" width="196" height="26" rx="6" fill="#f8fafc" stroke="#e7ebf0"/>
<text x="788" y="305" font-size="12.5" font-weight="600" text-anchor="middle" fill="#94a3b8" font-family="Menlo,Consolas,monospace">s[10] = v₁₀</text>
<rect x="690" y="318" width="196" height="26" rx="6" fill="#f8fafc" stroke="#e7ebf0"/>
<text x="788" y="335" font-size="12.5" font-weight="600" text-anchor="middle" fill="#94a3b8" font-family="Menlo,Consolas,monospace">s[11] = v₁₁</text>
<rect x="690" y="348" width="196" height="26" rx="6" fill="#f8fafc" stroke="#e7ebf0"/>
<text x="788" y="365" font-size="12.5" font-weight="600" text-anchor="middle" fill="#94a3b8" font-family="Menlo,Consolas,monospace">s[12] = v₁₂</text>
<rect x="690" y="378" width="196" height="26" rx="6" fill="#f8fafc" stroke="#e7ebf0"/>
<text x="788" y="395" font-size="12.5" font-weight="600" text-anchor="middle" fill="#94a3b8" font-family="Menlo,Consolas,monospace">s[13] = v₁₃</text>
<rect x="690" y="408" width="196" height="26" rx="6" fill="#f8fafc" stroke="#e7ebf0"/>
<text x="788" y="425" font-size="12.5" font-weight="600" text-anchor="middle" fill="#94a3b8" font-family="Menlo,Consolas,monospace">s[14] = v₁₄</text>
<line x1="682" y1="271" x2="570" y2="271" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#ahb)"/>
<text x="626.0" y="263.0" font-size="11" font-weight="700" text-anchor="middle" fill="#1d4ed8" font-family="Helvetica,Arial,sans-serif">reads fixed slot</text>
<text x="788.0" y="470" font-size="11.5" font-weight="600" text-anchor="middle" fill="#475569" font-family="Helvetica,Arial,sans-serif">→ node_val, then ⊕ into the input value</text>
<line x1="40" y1="486" x2="920" y2="486" stroke="#eef2f7"/>
<text x="40" y="506" font-size="12.5" fill="#334155"><tspan font-weight="700">2× variant:</tspan> to copy two values per jump, generate one block per <tspan font-family="Menlo,monospace">(j₁, j₂)</tspan> pair — the cartesian product of candidate indices.</text>
<text x="40" y="526" font-size="12.5" fill="#64748b">The table grows as N² (N = nodes at this depth), so the instruction count bounds how many layers can be jump-loaded.</text>
</svg>